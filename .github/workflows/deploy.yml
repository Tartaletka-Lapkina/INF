name: Deploy static site with Linting

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  lint-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # ШАГ 1: Проверка HTML (Линтинг)
      - name: Lint HTML
        uses: htmlhint/htmlhint-action@v1
        with:
          args: "--config .htmlhintrc"
        continue-on-error: false # Если найдет ошибки - остановит деплой

      # ШАГ 2: Подготовка GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      # ШАГ 3: Упаковка файлов
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      
      # ШАГ 4: Публикация
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
